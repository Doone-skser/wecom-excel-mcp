# wecom-excel MCP over HTTPS -> 127.0.0.1:8765 (systemd: wecom-excel-http).
# deploy/install.sh writes this to /etc/nginx/conf.d/wecom-excel.conf with wecom.example.com replaced by your domain.
# Callers send their own WeCom cookie in X-Wecom-Cookie; it is not logged (the default log format has no headers).

# Per-IP limit on /mcp (this file is included in the http block). A tool call is one request; the burst covers an
# assistant firing several calls at once.
limit_req_zone $binary_remote_addr zone=wecom_mcp:10m rate=10r/s;

server
{
    listen 80;
    server_name wecom.example.com;
    root /var/www/wecom-excel;

    # certbot webroot renewals
    location ^~ /.well-known/acme-challenge/ {
        allow all;
        default_type text/plain;
    }
    location / {
        return 301 https://$host$request_uri;
    }
    access_log  /var/log/nginx/wecom-excel.log;
    error_log  /var/log/nginx/wecom-excel.error.log;
}

server
{
    listen 443 ssl http2;
    server_name wecom.example.com;

    ssl_certificate     /etc/letsencrypt/live/wecom.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wecom.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:wecom_ssl:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Landing page for people and AI assistants (deploy/site/).
    root /var/www/wecom-excel;

    location = /mcp {
        # A browser opening /mcp gets the instructions instead of an endless SSE ping stream.
        if ($http_accept ~* "text/html") {
            return 302 /;
        }
        limit_req zone=wecom_mcp burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 1m;
    }
    # Usage statistics, behind the MCP server's own login form.
    location ^~ /admin {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
    charset utf-8;
    charset_types text/plain;
    location = / {
        index index.html;
    }
    location = /index.html {
    }
    location = /llms.txt {
    }
    location = /wecom-mcp.py {
        default_type text/plain;
    }
    location / {
        return 404;
    }
    access_log  /var/log/nginx/wecom-excel.log;
    error_log  /var/log/nginx/wecom-excel.error.log;
}
