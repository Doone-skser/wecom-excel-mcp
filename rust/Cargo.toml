[package]
name = "wecom-excel-native"
version = "0.2.0"
edition = "2021"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["abi3-py311"] }
ryu = "1"
serde_json = { version = "1", features = ["float_roundtrip"] }

[profile.release]
lto = "fat"
codegen-units = 1
