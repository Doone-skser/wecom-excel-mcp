<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wecom-excel 后台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%2307c160'/%3E%3Crect x='12' y='13' width='36' height='35' rx='5' fill='%23fff'/%3E%3Cpath d='M12 18a5 5 0 0 1 5-5h26a5 5 0 0 1 5 5v4H12z' fill='%23bdf0d5'/%3E%3Ccircle cx='47' cy='47' r='11' fill='%2314161b' stroke='%23fff' stroke-width='3'/%3E%3C/svg%3E">
<script>
// daisyUI's CDN build switches theme by data-theme only: follow the system setting.
(function () {
  var m = matchMedia("(prefers-color-scheme: dark)");
  var set = function () { document.documentElement.dataset.theme = m.matches ? "dark" : "light"; };
  set();
  m.addEventListener("change", function () { set(); if (window.render) render(); });
})();
</script>
<link href="https://cdn.jsdelivr.net/npm/daisyui@5.7.45" rel="stylesheet" type="text/css">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.0"></script>
<style>
/* brand green as daisyUI's primary */
:root[data-theme] { --color-primary: #07c160; --color-primary-content: #ffffff; }
:root[data-theme="dark"] { --color-primary: #1fd27a; --color-primary-content: #062b16; }
</style>
<style>
.viz { --series-1: #2a78d6; --grid: color-mix(in oklab, var(--color-base-content) 10%, transparent); }
[data-theme="dark"] .viz { --series-1: #3987e5; }
.meter { height: 6px; border-radius: 3px; background: var(--grid); overflow: hidden; }
.meter > div { height: 100%; border-radius: 3px; background: var(--series-1); }
.viz svg { display: block; width: 100%; overflow: visible; }
.viz .bar { fill: var(--series-1); }
.viz .bar.dim { opacity: .35; }
.viz .hit { fill: transparent; cursor: default; }
.viz .gridline { stroke: var(--grid); stroke-width: 1; }
.viz .tick { fill: color-mix(in oklab, var(--color-base-content) 55%, transparent); font-size: 11px; }
#tip { position: fixed; pointer-events: none; z-index: 50; opacity: 0; transition: opacity .1s; }
.num { font-variant-numeric: tabular-nums; }
</style>
</head>
<body class="bg-base-200 min-h-screen">

<div class="navbar bg-base-100 border-b border-base-300 px-4 sticky top-0 z-40 flex-wrap gap-2">
  <div class="flex-1 flex items-center gap-3 min-w-48">
    <svg class="w-8 h-8 shrink-0" viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2ad883"/><stop offset="1" stop-color="#05a854"/></linearGradient></defs><rect width="64" height="64" rx="15" fill="url(#lg)"/><rect x="12" y="13" width="36" height="35" rx="5" fill="#fff"/><path d="M12 18a5 5 0 0 1 5-5h26a5 5 0 0 1 5 5v4H12z" fill="#bdf0d5"/><path d="M24 13v35M36 13v35M12 30.5h36M12 39h36" stroke="#07c160" stroke-opacity=".35" stroke-width="1.6"/><circle cx="47" cy="47" r="11" fill="#14161b" stroke="#fff" stroke-width="3"/><path d="M47 40.5c.7 4 2.5 5.8 6.5 6.5-4 .7-5.8 2.5-6.5 6.5-.7-4-2.5-5.8-6.5-6.5 4-.7 5.8-2.5 6.5-6.5z" fill="#2ad883"/></svg>
    <div class="min-w-0">
      <div class="font-semibold leading-tight">wecom-excel 后台</div>
      <div class="text-xs opacity-60 truncate" id="updated">加载中…</div>
    </div>
  </div>
  <div class="flex items-center gap-2">
    <div class="join" id="ranges">
      <button class="btn btn-sm join-item" data-days="1">今天</button>
      <button class="btn btn-sm join-item" data-days="7">7 天</button>
      <button class="btn btn-sm join-item btn-active" data-days="30">30 天</button>
      <button class="btn btn-sm join-item" data-days="90">90 天</button>
    </div>
    <button class="btn btn-sm btn-ghost btn-square" id="refresh" title="刷新" aria-label="刷新">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h5M20 20v-5h-5M5.6 15a7 7 0 0 0 12.3 2.4M18.4 9A7 7 0 0 0 6.1 6.6"/></svg>
    </button>
    <form method="post" action="/admin/logout">
      <button class="btn btn-sm btn-ghost btn-square" title="退出登录" aria-label="退出登录">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l5-5-5-5M15 12H4"/></svg>
      </button>
    </form>
  </div>
</div>

<main class="max-w-7xl mx-auto p-4 space-y-4">
  <div role="alert" class="alert alert-error hidden" id="err"></div>

  <div class="stats stats-vertical sm:stats-horizontal shadow-sm bg-base-100 w-full" id="stats"></div>

  <div class="grid grid-cols-1 gap-4 lg:grid-cols-3">
    <div class="card bg-base-100 shadow-sm lg:col-span-2">
      <div class="card-body p-5">
        <div class="flex items-center justify-between gap-2">
          <h2 class="card-title text-base">每日调用</h2>
          <div role="tablist" class="tabs tabs-box tabs-xs">
            <a role="tab" class="tab tab-active" data-view="chart">图</a>
            <a role="tab" class="tab" data-view="table">表</a>
          </div>
        </div>
        <div class="viz mt-2" id="daily"></div>
        <div class="overflow-x-auto max-h-72 hidden" id="dailyTable"></div>
      </div>
    </div>
    <div class="card bg-base-100 shadow-sm">
      <div class="card-body p-5">
        <h2 class="card-title text-base">时段分布</h2>
        <div class="viz mt-2" id="hours"></div>
      </div>
    </div>
  </div>

  <div class="grid grid-cols-1 gap-4 lg:grid-cols-3">
    <div class="card bg-base-100 shadow-sm">
      <div class="card-body p-5">
        <h2 class="card-title text-base">工具</h2>
        <div id="tools" class="viz space-y-3 mt-1"></div>
      </div>
    </div>
    <div class="card bg-base-100 shadow-sm lg:col-span-2">
      <div class="card-body p-5">
        <h2 class="card-title text-base">用户</h2>
        <div class="overflow-x-auto max-h-80"><table class="table table-sm table-pin-rows" id="users"></table></div>
      </div>
    </div>
  </div>

  <div class="grid grid-cols-1 gap-4 lg:grid-cols-2">
    <div class="card bg-base-100 shadow-sm">
      <div class="card-body p-5">
        <h2 class="card-title text-base">热门表格</h2>
        <div class="overflow-x-auto max-h-80"><table class="table table-sm table-pin-rows" id="docs"></table></div>
      </div>
    </div>
    <div class="card bg-base-100 shadow-sm">
      <div class="card-body p-5">
        <h2 class="card-title text-base">错误</h2>
        <div class="overflow-x-auto max-h-80"><table class="table table-sm table-pin-rows" id="errors"></table></div>
      </div>
    </div>
  </div>

  <div class="card bg-base-100 shadow-sm">
    <div class="card-body p-5">
      <h2 class="card-title text-base">最近调用 <span class="text-xs font-normal opacity-60">最近 50 条，不受时间范围影响</span></h2>
      <div class="overflow-x-auto max-h-[28rem]"><table class="table table-sm table-pin-rows" id="recent"></table></div>
    </div>
  </div>

  <p class="text-xs opacity-50 text-center pb-4">只记录调用统计：安装 ID 和账号名（由客户端上报）、IP、表格、耗时和结果。不记录 cookie 和表格内容。数据保留 180 天。</p>
</main>

  <div class="modal-box max-w-sm">
    <h3 class="font-semibold text-lg">标记用户</h3>

      <p class="text-xs text-error mt-2 hidden" id="labelErr"></p>
      <div class="modal-action">
        <button type="button" class="btn btn-ghost mr-auto" id="labelClear">清除</button>
        <button type="button" class="btn" id="labelCancel">取消</button>
        <button class="btn btn-primary">保存</button>
      </div>

  </div>

</dialog>

<div id="tip" class="card bg-base-100 shadow-lg border border-base-300 text-sm px-3 py-2"></div>

<script>
var days = 30, data = null;
try { days = +localStorage.getItem("wecom-admin-days") || 30; } catch (e) {}

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return {"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c];
  });
}
function fmt(n) { return Number(n || 0).toLocaleString("zh-CN"); }
function ms(n) { return n >= 1000 ? (n / 1000).toFixed(n >= 10000 ? 0 : 1) + " s" : fmt(n) + " ms"; }
function pct(a, b) { return b ? (a / b * 100).toFixed(a / b < 0.1 ? 1 : 0) + "%" : "0%"; }
function ago(ts) {
  var s = Date.now() / 1000 - ts;
  if (s < 60) return "刚刚";
  if (s < 3600) return Math.floor(s / 60) + " 分钟前";
  if (s < 86400) return Math.floor(s / 3600) + " 小时前";
  if (s < 86400 * 30) return Math.floor(s / 86400) + " 天前";
  return when(ts);
}
function when(ts) {
  var d = new Date(ts * 1000), p = function (n) { return String(n).padStart(2, "0"); };
  return (d.getMonth() + 1) + "-" + p(d.getDate()) + " " + p(d.getHours()) + ":" + p(d.getMinutes());
}
var TOOL = {list_sheets: "列出标签页", read_sheet: "读取", search_sheet: "搜索", get_images: "图片"};
function toolName(t) { return TOOL[t] ? TOOL[t] + ' <span class="opacity-50 font-mono text-xs">' + esc(t) + "</span>" : esc(t); }
function docLink(pad, title) {
  if (!pad) return '<span class="opacity-40">—</span>';
  return '<a class="link link-hover" target="_blank" rel="noopener" href="https://doc.weixin.qq.com/sheet/' +
    encodeURIComponent(pad) + '">' + (title ? esc(title) : '<span class="font-mono text-xs">' + esc(pad) + "</span>") + "</a>";
}
// A caller: its label, else the account name, else the IP; below it what else identifies it.
function who(r) {
  var main = r.label || r.name || r.ip || "未知";
  var sub = [];
  if (r.label && r.name) sub.push(r.name);
  sub.push(r.client_id ? "ID " + r.client_id.slice(0, 8) : "旧版客户端，无 ID");
  return '<div class="font-medium whitespace-nowrap">' + esc(main) + '</div><div class="text-xs opacity-60 whitespace-nowrap" title="' +
    esc(r.client_id || "") + '">' + esc(sub.join(" · ")) + "</div>";
}
function status(ok) {
  return ok ? '<span class="badge badge-sm badge-soft badge-success">✓ 成功</span>'
            : '<span class="badge badge-sm badge-soft badge-error">✕ 失败</span>';
}
function empty(cols, text) { return '<tr><td colspan="' + cols + '" class="text-center opacity-50 py-6">' + (text || "暂无数据") + "</td></tr>"; }

// ---- stat tiles
function renderStats(d) {
  var t = d.totals, p = d.previous, label = d.days === 1 ? "今天" : d.days + " 天";
  var delta = "";
  if (d.days > 1) {
    if (p.calls) {
      var r = (t.calls - p.calls) / p.calls * 100;
      delta = (r >= 0 ? "↑ " : "↓ ") + Math.abs(r).toFixed(0) + "% 较前 " + d.days + " 天";
    } else delta = "前 " + d.days + " 天无调用";
  }
  var tiles = [
    ["今日调用", fmt(t.today), d.days === 1 ? "" : ""],
    [label + "调用", fmt(t.calls), delta],
    ["活跃用户", fmt(t.users), "按安装 ID，旧版按账号名或 IP"],
    ["表格", fmt(t.docs), "被读取过的表格数"],
    ["失败率", pct(t.errors, t.calls), fmt(t.errors) + " 次失败"],
    ["耗时", ms(t.avg_ms), "平均 · P95 " + ms(t.p95_ms)],
  ];
  if (d.days === 1) tiles.splice(1, 1);
  document.getElementById("stats").innerHTML = tiles.map(function (x) {
    return '<div class="stat"><div class="stat-title">' + x[0] + '</div><div class="stat-value text-2xl num">' + x[1] +
      '</div><div class="stat-desc">' + esc(x[2]) + "</div></div>";
  }).join("");
}

// ---- column chart (single series): thin bars, 4px rounded tops on the baseline, 2px gaps, hover tooltip
var tip = document.getElementById("tip");
function showTip(e, html) {
  tip.innerHTML = html; tip.style.opacity = 1;
  var x = e.clientX + 14, y = e.clientY + 14, w = tip.offsetWidth, h = tip.offsetHeight;
  if (x + w > innerWidth - 8) x = e.clientX - w - 14;
  if (y + h > innerHeight - 8) y = e.clientY - h - 14;
  tip.style.left = x + "px"; tip.style.top = y + "px";
}
function hideTip() { tip.style.opacity = 0; }

function niceMax(v) {
  if (v <= 4) return 4;
  var p = Math.pow(10, Math.floor(Math.log10(v))), m = v / p;
  return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 5 ? 5 : 10) * p;
}
function columns(el, rows, opt) {
  var W = el.clientWidth || 600, H = opt.height || 220, L = 36, R = 4, T = 8, B = 22;
  var max = niceMax(Math.max.apply(null, rows.map(function (r) { return r.v; }).concat([0])));
  var n = rows.length, slot = (W - L - R) / n, gap = Math.max(2, slot * 0.25), bw = Math.max(1, slot - gap);
  var y = function (v) { return T + (H - T - B) * (1 - v / max); };
  var svg = '<svg viewBox="0 0 ' + W + " " + H + '" height="' + H + '" role="img" aria-label="' + esc(opt.label) + '">';
  for (var i = 0; i <= 4; i++) {
    var v = max * i / 4, yy = y(v);
    svg += '<line class="gridline" x1="' + L + '" x2="' + (W - R) + '" y1="' + yy + '" y2="' + yy + '"/>' +
      '<text class="tick num" x="' + (L - 6) + '" y="' + (yy + 4) + '" text-anchor="end">' + fmt(v) + "</text>";
  }
  var every = Math.ceil(n / Math.max(1, Math.floor((W - L) / 56)));
  rows.forEach(function (r, i) {
    var x = L + i * slot + gap / 2, top = y(r.v), h = H - B - top, rad = Math.min(4, bw / 2, h);
    if (r.v > 0) {
      svg += '<path class="bar' + (r.dim ? " dim" : "") + '" d="M' + x + "," + (H - B) + "V" + (top + rad) +
        "Q" + x + "," + top + " " + (x + rad) + "," + top + "H" + (x + bw - rad) + "Q" + (x + bw) + "," + top + " " +
        (x + bw) + "," + (top + rad) + "V" + (H - B) + 'Z"/>';
    }
    if (i % every === 0) svg += '<text class="tick" x="' + (x + bw / 2) + '" y="' + (H - 6) + '" text-anchor="middle">' + esc(r.label) + "</text>";
    svg += '<rect class="hit" data-i="' + i + '" x="' + (L + i * slot) + '" y="' + T + '" width="' + slot + '" height="' + (H - T - B) + '"/>';
  });
  el.innerHTML = svg + "</svg>";
  el.querySelectorAll(".hit").forEach(function (h) {
    h.addEventListener("mousemove", function (e) { showTip(e, opt.tip(rows[+h.dataset.i])); });
    h.addEventListener("mouseleave", hideTip);
  });
}

function renderCharts(d) {
  columns(document.getElementById("daily"), d.daily.map(function (r) {
    return {v: r.calls, label: r.day.slice(5).replace("-", "/"), r: r};
  }), {label: "每日调用次数", tip: function (x) {
    var r = x.r;
    return '<div class="font-semibold mb-1">' + r.day + '</div><div class="num">调用 <b>' + fmt(r.calls) + "</b></div>" +
      '<div class="num opacity-70">失败 ' + fmt(r.errors) + " · 用户 " + fmt(r.users) + "</div>";
  }});
  var byHour = {};
  d.hours.forEach(function (h) { byHour[h.hour] = h.calls; });
  var hours = [];
  for (var h = 0; h < 24; h++) hours.push({v: byHour[h] || 0, label: String(h), h: h});
  columns(document.getElementById("hours"), hours, {label: "按小时的调用次数", tip: function (x) {
    return '<div class="font-semibold mb-1">' + x.h + ":00 – " + x.h + ':59</div><div class="num">调用 <b>' + fmt(x.v) + "</b></div>";
  }});
  document.getElementById("dailyTable").innerHTML = '<table class="table table-sm table-pin-rows"><thead><tr><th>日期</th><th class="text-right">调用</th><th class="text-right">失败</th><th class="text-right">用户</th></tr></thead><tbody>' +
    d.daily.slice().reverse().map(function (r) {
      return '<tr><td class="num">' + r.day + '</td><td class="text-right num">' + fmt(r.calls) + '</td><td class="text-right num">' +
        fmt(r.errors) + '</td><td class="text-right num">' + fmt(r.users) + "</td></tr>";
    }).join("") + "</tbody></table>";
}

function renderTables(d) {
  var max = Math.max.apply(null, d.tools.map(function (t) { return t.calls; }).concat([1]));
  document.getElementById("tools").innerHTML = d.tools.length ? d.tools.map(function (t) {
    return '<div><div class="flex justify-between text-sm"><span>' + toolName(t.tool) + '</span><span class="num">' + fmt(t.calls) +
      '</span></div><div class="meter my-1"><div style="width:' + (t.calls / max * 100).toFixed(1) + '%"></div></div>' +
      '<div class="text-xs opacity-60 num">平均 ' + ms(t.avg_ms) + (t.errors ? " · 失败 " + fmt(t.errors) : "") + "</div></div>";
  }).join("") : '<p class="opacity-50 text-sm py-6 text-center">暂无数据</p>';

  document.getElementById("users").innerHTML = '<thead><tr><th>用户</th><th>IP</th><th class="text-right">调用</th><th class="text-right">失败</th><th class="text-right">表格</th><th>最近</th><th>客户端</th><th></th></tr></thead><tbody>' +
    (d.users.length ? d.users.map(function (u) {
      return "<tr><td>" + who(u) + '</td><td class="font-mono text-xs whitespace-nowrap">' + esc(u.ip || "—") + '</td><td class="text-right num">' + fmt(u.calls) + '</td><td class="text-right num">' +
        (u.errors ? '<span class="text-error">' + fmt(u.errors) + "</span>" : "0") + '</td><td class="text-right num">' + fmt(u.docs) +
        '</td><td class="whitespace-nowrap" title="' + when(u.last_ts) + '">' + ago(u.last_ts) + '</td><td><span class="badge badge-sm badge-ghost font-mono">' +
        esc((u.client || "?").replace("wecom-mcp.py/", "v")) + '</span></td><td><button class="btn btn-xs btn-ghost" data-label-key="' + esc(u.key) +
        '">' + (u.label ? "改标记" : "标记") + "</button></td></tr>";
    }).join("") : empty(8)) + "</tbody>";

  document.getElementById("docs").innerHTML = '<thead><tr><th>表格</th><th class="text-right">调用</th><th class="text-right">用户</th><th>最近</th></tr></thead><tbody>' +
    (d.docs.length ? d.docs.map(function (x) {
      return "<tr><td>" + docLink(x.pad_id, x.title) + '</td><td class="text-right num">' + fmt(x.calls) + '</td><td class="text-right num">' +
        fmt(x.users) + '</td><td class="whitespace-nowrap">' + ago(x.last_ts) + "</td></tr>";
    }).join("") : empty(4)) + "</tbody>";

  document.getElementById("errors").innerHTML = '<thead><tr><th>错误</th><th class="text-right">次数</th><th>最近</th></tr></thead><tbody>' +
    (d.errors.length ? d.errors.map(function (x) {
      return '<tr><td class="text-xs break-all">' + esc(x.error) + '</td><td class="text-right num">' + fmt(x.calls) +
        '</td><td class="whitespace-nowrap">' + ago(x.last_ts) + "</td></tr>";
    }).join("") : empty(3, "没有错误")) + "</tbody>";

  document.getElementById("recent").innerHTML = '<thead><tr><th>时间</th><th>用户</th><th>IP</th><th>工具</th><th>表格</th><th class="text-right">耗时</th><th>结果</th></tr></thead><tbody>' +
    (d.recent.length ? d.recent.map(function (r) {
      return '<tr><td class="whitespace-nowrap num" title="' + ago(r.ts) + '">' + when(r.ts) + "</td><td>" + who(r) + '</td><td class="font-mono text-xs whitespace-nowrap">' +
        esc(r.ip || "—") + '</td><td class="whitespace-nowrap">' + toolName(r.tool) + "</td><td>" + docLink(r.pad_id, r.title) +
        '</td><td class="text-right num whitespace-nowrap">' + ms(r.ms) + "</td><td" + (r.ok ? "" : ' title="' + esc(r.error) + '"') + ">" + status(r.ok) + "</td></tr>";
    }).join("") : empty(7)) + "</tbody>";
}

function render() {
  if (!data) return;
  renderStats(data); renderCharts(data); renderTables(data);
}

function load() {
  document.querySelectorAll("#ranges .btn").forEach(function (b) { b.classList.toggle("btn-active", +b.dataset.days === days); });
  fetch("/admin/api/stats?days=" + days, {cache: "no-store"}).then(function (r) {
    if (r.status === 401) { location.href = "/admin/login"; throw new Error("需要重新登录"); }
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  }).then(function (d) {
    data = d; document.getElementById("err").classList.add("hidden");
    document.getElementById("updated").textContent = "更新于 " + new Date().toLocaleTimeString("zh-CN") + " · 每分钟自动刷新";
    render();
  }).catch(function (e) {
    var el = document.getElementById("err"); el.textContent = "加载失败：" + e.message; el.classList.remove("hidden");
  });
}

document.querySelectorAll("#ranges .btn").forEach(function (b) {
  b.addEventListener("click", function () {
    days = +b.dataset.days;
    try { localStorage.setItem("wecom-admin-days", days); } catch (e) {}
    load();
  });
});
document.getElementById("refresh").addEventListener("click", load);
document.querySelectorAll("[data-view]").forEach(function (t) {
  t.addEventListener("click", function () {
    document.querySelectorAll("[data-view]").forEach(function (x) { x.classList.toggle("tab-active", x === t); });
    document.getElementById("daily").classList.toggle("hidden", t.dataset.view !== "chart");
    document.getElementById("dailyTable").classList.toggle("hidden", t.dataset.view !== "table");
  });
});
// ---- labels
var labelKey = null, dlg = document.getElementById("labelDlg");
document.getElementById("users").addEventListener("click", function (e) {
  var b = e.target.closest("[data-label-key]");
  if (!b) return;
  labelKey = b.dataset.labelKey;
  var u = data.users.filter(function (x) { return x.key === labelKey; })[0] || {};
  document.getElementById("labelWho").textContent = [u.name, u.ip, u.client_id ? "ID " + u.client_id : "旧版客户端（按" + (u.name ? "账号名" : "IP") + "识别）"].filter(Boolean).join(" · ");
  document.getElementById("labelInput").value = u.label || "";
  document.getElementById("labelErr").classList.add("hidden");
  dlg.showModal();
  document.getElementById("labelInput").focus();
});
function saveLabel(label) {
  fetch("/admin/api/label", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({key: labelKey, label: label})})
    .then(function (r) {
      if (r.status === 401) { location.href = "/admin/login"; return; }
      if (!r.ok) throw new Error("HTTP " + r.status);
      dlg.close(); load();
    }).catch(function (e) {
      var el = document.getElementById("labelErr"); el.textContent = "保存失败：" + e.message; el.classList.remove("hidden");
    });
}
document.getElementById("labelForm").addEventListener("submit", function (e) { e.preventDefault(); saveLabel(document.getElementById("labelInput").value); });
document.getElementById("labelClear").addEventListener("click", function () { saveLabel(""); });
document.getElementById("labelCancel").addEventListener("click", function () { dlg.close(); });

var rt;
addEventListener("resize", function () { clearTimeout(rt); rt = setTimeout(render, 150); });
setInterval(load, 60000);
load();
</script>
</body>
</html>
